<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Pay</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #00C244;
  color: black;
}

/* TOP */
.top {
  display: flex;
  justify-content: space-between;
  padding: 15px;
}

/* AMOUNT */
.amount {
  text-align: center;
  font-size: 80px;
  margin-top: 40px;
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 30px;
  text-align: center;
  font-size: 28px;
}

.key { padding: 15px; }

/* BUTTONS */
.actions {
  display: flex;
  gap: 10px;
  padding: 0 20px;
}

.btn {
  flex: 1;
  padding: 15px;
  border-radius: 25px;
  border: none;
}

.pay {
  margin: 20px;
  background: black;
  color: white;
  padding: 18px;
  border-radius: 30px;
  text-align: center;
}

/* QR MODAL */
.qr-modal {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: black;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.qr-modal img {
  width: 250px;
}

/* AI */
.ai-btn {
  position: fixed;
  bottom: 90px;
  right: 20px;
  background: black;
  color: white;
  border-radius: 50%;
  width: 60px;
  height: 60px;
}

.ai-box {
  position: fixed;
  bottom: 160px;
  right: 20px;
  width: 260px;
  background: white;
  padding: 10px;
  border-radius: 10px;
  display:none;
}
</style>
</head>

<body>

<div class="top">
  <div onclick="openQR()">📷</div>
  <div>😊</div>
</div>

<div class="amount" id="amount">$0</div>

<div class="keypad">
  <div onclick="press(1)">1</div>
  <div onclick="press(2)">2</div>
  <div onclick="press(3)">3</div>
  <div onclick="press(4)">4</div>
  <div onclick="press(5)">5</div>
  <div onclick="press(6)">6</div>
  <div onclick="press(7)">7</div>
  <div onclick="press(8)">8</div>
  <div onclick="press(9)">9</div>
  <div onclick="press('.')">.</div>
  <div onclick="press(0)">0</div>
  <div onclick="back()">⌫</div>
</div>

<div class="actions">
  <button class="btn">Pool</button>
  <button class="btn">Request</button>
</div>

<div class="pay" onclick="startPayment()">Pay</div>

<!-- QR SCREEN -->
<div class="qr-modal" id="qrModal">
  <h2 style="color:white;">Scan to Pay</h2>
  <img src="qr.PNG">
  <p id="status" style="color:white;">Waiting for payment...</p>
  <button onclick="closeQR()">Close</button>
</div>

<!-- AI -->
<button class="ai-btn" onclick="toggleAI()">AI</button>

<div class="ai-box" id="aiBox">
  <textarea id="aiInput"></textarea>
  <button onclick="askAI()">Send</button>
  <button onclick="voice()">🎤</button>
  <p id="aiResponse"></p>
</div>

<script>
let val = "";

// INPUT
function press(n) {
  val += n;
  document.getElementById("amount").innerText = "$" + val;
}

function back() {
  val = val.slice(0,-1);
  document.getElementById("amount").innerText = "$" + (val || 0);
}

// PAYMENT
let orderId;

function startPayment() {
  orderId = "order_" + Date.now();
  openQR();
  checkLoop();
}

// QR
function openQR() {
  document.getElementById("qrModal").style.display = "flex";
}

function closeQR() {
  document.getElementById("qrModal").style.display = "none";
}

// CHECK PAYMENT
async function checkPayment() {
  const res = await fetch("https://YOUR-BACKEND.onrender.com/api/check/" + orderId);
  const data = await res.json();

  if(data.status === "paid"){
    document.getElementById("status").innerText = "✅ Payment Complete";
  }
}

function checkLoop(){
  setInterval(checkPayment, 5000);
}

// AI
function toggleAI(){
  const box = document.getElementById("aiBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

// REAL AI (needs backend)
async function askAI(){
  const input = document.getElementById("aiInput").value;

  const res = await fetch("https://YOUR-BACKEND.onrender.com/api/ai",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({message:input})
  });

  const data = await res.json();
  document.getElementById("aiResponse").innerText = data.reply;
}

// VOICE
function voice(){
  const rec = new webkitSpeechRecognition();
  rec.start();
  rec.onresult = e => {
    document.getElementById("aiInput").value = e.results[0][0].transcript;
  };
}
</script>

</body>
</html>
