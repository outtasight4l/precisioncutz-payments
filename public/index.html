<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Pay</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at center, #021a05, #000);
  font-family: Arial;
  color: #00ff66;
  text-align: center;
  overflow: hidden;
}

/* BACKGROUND GLOW */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(0,255,100,0.15), transparent 70%);
  animation: pulse 4s infinite;
  z-index: -1;
}

@keyframes pulse {
  0% { opacity: .3 }
  50% { opacity: .6 }
  100% { opacity: .3 }
}

/* LOGO */
.logo img {
  width: 260px;
  margin-top: 40px;
  filter: drop-shadow(0 0 25px #00ff66);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0) }
  50% { transform: translateY(-10px) }
}

/* AMOUNT */
.amount {
  font-size: 90px;
  margin: 20px 0;
  font-weight: bold;
  text-shadow:
    0 0 10px #00ff66,
    0 0 20px #00ff66,
    0 0 40px #00ff66,
    0 4px 8px rgba(0,255,100,0.5);
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #00ff66 }
  to { text-shadow: 0 0 30px #00ff66 }
}

/* BUTTONS */
.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

button {
  width: 140px;
  height: 50px;
  border-radius: 15px;
  border: 2px solid #00ff66;
  background: transparent;
  color: #00ff66;
  font-weight: bold;
  font-size: 18px;
  box-shadow: 0 0 15px #00ff66;
  transition: .2s;
}

button:hover {
  background: #00ff66;
  color: black;
  transform: scale(1.05);
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding: 40px;
}

/* 3D NUMBERS */
.key {
  font-size: 36px;
  padding: 15px;
  border-radius: 10px;
  background: linear-gradient(145deg, #00ff66, #006633);
  color: black;
  box-shadow:
    0 6px 0 #003300,
    0 0 20px #00ff66;
  transform: perspective(300px) rotateX(15deg);
  transition: .1s;
}

.key:active {
  transform: scale(.9);
  box-shadow: 0 2px 0 #003300;
}

/* FLOATING KEYS */
.key:nth-child(1){animation:float2 3s infinite}
.key:nth-child(2){animation:float2 3.2s infinite}
.key:nth-child(3){animation:float2 3.4s infinite}
.key:nth-child(4){animation:float2 3.6s infinite}
.key:nth-child(5){animation:float2 3.8s infinite}
.key:nth-child(6){animation:float2 4s infinite}
.key:nth-child(7){animation:float2 4.2s infinite}
.key:nth-child(8){animation:float2 4.4s infinite}
.key:nth-child(9){animation:float2 4.6s infinite}

@keyframes float2 {
  0%,100% { transform: translateY(0) rotateX(15deg)}
  50% { transform: translateY(-6px) rotateX(15deg)}
}
</style>
</head>

<body>

<div class="logo">
  <!-- 🔥 FIXED PATH -->
  <img src="/logo.PNG">
</div>

<div class="amount" id="amount">$0</div>

<div class="buttons">
  <button>Request</button>
  <button>Pay</button>
</div>

<div class="keypad">
  <div class="key" onclick="press(1)">1</div>
  <div class="key" onclick="press(2)">2</div>
  <div class="key" onclick="press(3)">3</div>

  <div class="key" onclick="press(4)">4</div>
  <div class="key" onclick="press(5)">5</div>
  <div class="key" onclick="press(6)">6</div>

  <div class="key" onclick="press(7)">7</div>
  <div class="key" onclick="press(8)">8</div>
  <div class="key" onclick="press(9)">9</div>

  <div class="key" onclick="press('.')">.</div>
  <div class="key" onclick="press(0)">0</div>
  <div class="key" onclick="del()">⌫</div>
</div>

<script>
let amount = "";

function press(num){
  if(num==="." && amount.includes(".")) return;
  amount += num;
  update();
}

function del(){
  amount = amount.slice(0,-1);
  update();
}

function update(){
  document.getElementById("amount").innerText = "$" + (amount || "0");
}
</script>

</body>
</html>
