<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz POS</title>

<style>
body {
  margin: 0;
  background: #050505;
  font-family: 'Arial Black', sans-serif;
  color: #00ff66;
  text-align: center;
}

/* TITLE */
h1 {
  margin-top: 20px;
  font-size: 28px;
  letter-spacing: 2px;
}

/* DISPLAY BOX */
#displayBox {
  width: 85%;
  margin: 20px auto;
  padding: 20px;
  border: 2px solid #00ff66;
  border-radius: 15px;
  background: black;
  overflow: hidden;
}

/* PRICE TEXT */
#display {
  font-weight: 900;
  text-align: right;
  white-space: nowrap;
  font-size: 80px;
  line-height: 1;
  
  /* GLOW EFFECT */
  color: #00ff66;
  text-shadow:
    0 0 5px #00ff66,
    0 0 10px #00ff66,
    0 0 20px #00ff66,
    0 0 40px #00ff66;
}

/* BUTTON ROW */
.actions {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 20px;
}

button {
  background: black;
  border: 2px solid #00ff66;
  color: #00ff66;
  padding: 15px 25px;
  font-size: 18px;
  border-radius: 10px;
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 90px);
  gap: 20px;
  justify-content: center;
  margin-top: 30px;
}

.key {
  font-size: 32px;
  padding: 20px;
  border: 2px solid #00ff66;
  border-radius: 12px;
  background: black;
}

.key:active {
  background: #00ff66;
  color: black;
}
</style>
</head>

<body>

<h1>PRECISION CUTZ</h1>

<div id="displayBox">
  <div id="display">$0.00</div>
</div>

<div class="actions">
  <button onclick="requestMoney()">REQUEST</button>
  <button onclick="pay()">PAY</button>
</div>

<div class="keypad">
  <div class="key" onclick="press(1)">1</div>
  <div class="key" onclick="press(2)">2</div>
  <div class="key" onclick="press(3)">3</div>
  <div class="key" onclick="press(4)">4</div>
  <div class="key" onclick="press(5)">5</div>
  <div class="key" onclick="press(6)">6</div>
  <div class="key" onclick="press(7)">7</div>
  <div class="key" onclick="press(8)">8</div>
  <div class="key" onclick="press(9)">9</div>
  <div class="key" onclick="clearAll()">C</div>
  <div class="key" onclick="press(0)">0</div>
  <div class="key" onclick="backspace()">⌫</div>
</div>

<script>
let amount = 0;

/* AUTO FORMAT + AUTO RESIZE */
function updateDisplay() {
  let dollars = (amount / 100).toFixed(2);
  let display = document.getElementById("display");
  display.innerText = "$" + dollars;

  autoResize();
}

/* DYNAMIC FONT SCALING */
function autoResize() {
  const display = document.getElementById("display");
  const box = document.getElementById("displayBox");

  let fontSize = 80;
  display.style.fontSize = fontSize + "px";

  while (display.scrollWidth > box.clientWidth - 20 && fontSize > 20) {
    fontSize -= 2;
    display.style.fontSize = fontSize + "px";
  }
}

/* INPUT LOGIC (POS STYLE) */
function press(num) {
  amount = amount * 10 + num;

  if (amount > 99999999999) amount = 99999999999;

  updateDisplay();
}

/* CLEAR */
function clearAll() {
  amount = 0;
  updateDisplay();
}

/* BACKSPACE */
function backspace() {
  amount = Math.floor(amount / 10);
  updateDisplay();
}

/* PAY */
function pay() {
  let value = (amount / 100).toFixed(2);

  if (amount === 0) {
    alert("Enter amount first");
    return;
  }

  window.location.href = `https://cash.app/$cryptogang85/${value}`;
}

/* REQUEST */
function requestMoney() {
  let value = (amount / 100).toFixed(2);

  if (amount === 0) {
    alert("Enter amount first");
    return;
  }

  alert("Request sent for $" + value);
}

/* INIT */
updateDisplay();
</script>

</body>
</html>
