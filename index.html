<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff66">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<title>Precision Cutz Terminal</title>

<style>
body {
  margin:0;
  background:#000;
  font-family:'Orbitron',sans-serif;
  color:#00ff66;
  text-align:center;
}

/* TOP */
.top-bar {
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.icon {
  border:2px solid #00ff66;
  border-radius:50%;
  padding:10px;
  box-shadow:0 0 10px #00ff66;
}

/* DISPLAY */
.display-box {
  width:90%;
  margin:20px auto;
  padding:25px;
  border:2px solid #00ff66;
  border-radius:20px;
}

#display {
  font-size:90px;
  text-align:right;
  white-space:nowrap;
  text-shadow:0 0 20px #00ff66;
}

/* KEYPAD */
.keypad {
  display:grid;
  grid-template-columns:repeat(3,90px);
  gap:20px;
  justify-content:center;
}

.key {
  padding:25px;
  border:2px solid #00ff66;
  border-radius:15px;
}

/* QR SCANNER */
#scanner {
  display:none;
}
</style>
</head>

<body>

<div class="top-bar">
  <div class="icon" onclick="openScanner()">📷</div>
  <div class="icon" onclick="alert('AI Coming')">🤖</div>
</div>

<h2>PRECISION CUTZ</h2>

<div class="display-box">
  <div id="display">$0.00</div>
</div>

<div class="keypad">
  <div class="key" onclick="press(1)">1</div>
  <div class="key" onclick="press(2)">2</div>
  <div class="key" onclick="press(3)">3</div>
  <div class="key" onclick="press(4)">4</div>
  <div class="key" onclick="press(5)">5</div>
  <div class="key" onclick="press(6)">6</div>
  <div class="key" onclick="press(7)">7</div>
  <div class="key" onclick="press(8)">8</div>
  <div class="key" onclick="press(9)">9</div>
  <div class="key" onclick="clearAll()">C</div>
  <div class="key" onclick="press(0)">0</div>
  <div class="key" onclick="backspace()">⌫</div>
</div>

<br>

<button onclick="pay()">PAY</button>

<!-- CAMERA -->
<video id="scanner" width="100%" autoplay></video>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let amount = 0;

function updateDisplay() {
  document.getElementById("display").innerText =
    "$" + (amount/100).toFixed(2);
}

function press(n){
  amount = amount*10 + n;
  updateDisplay();
}

function clearAll(){
  amount = 0;
  updateDisplay();
}

function backspace(){
  amount = Math.floor(amount/10);
  updateDisplay();
}

function pay(){
  let v = (amount/100).toFixed(2);
  window.location.href = `https://cash.app/$cryptogang85/${v}`;
}

/* CAMERA QR SCANNER */
function openScanner(){
  document.getElementById("scanner").style.display = "block";

  const scanner = new Html5Qrcode("scanner");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 250
    },
    (decodedText) => {
      alert("QR Scanned: " + decodedText);
      scanner.stop();
    }
  );
}

/* SERVICE WORKER */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

updateDisplay();
</script>

</body>
</html>
