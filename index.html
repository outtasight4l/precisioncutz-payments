<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- IMAGE -->
  <img src="ui.PNG?v=1" class="ui">

  <!-- BUTTON OVERLAYS -->
  <button class="btn qr" onclick="openQR()"></button>
  <button class="btn ai" onclick="openAI()"></button>
  <button class="btn request" onclick="requestMoney()"></button>
  <button class="btn pay" onclick="payMoney()"></button>

  <!-- DISPLAY -->
  <div id="display" class="display">$0.00</div>

  <!-- KEYPAD -->
  <div class="keypad">
    <button onclick="press('1')"></button>
    <button onclick="press('2')"></button>
    <button onclick="press('3')"></button>

    <button onclick="press('4')"></button>
    <button onclick="press('5')"></button>
    <button onclick="press('6')"></button>

    <button onclick="press('7')"></button>
    <button onclick="press('8')"></button>
    <button onclick="press('9')"></button>

    <button onclick="press('.')"></button>
    <button onclick="press('0')"></button>
    <button onclick="clearDisplay()"></button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
