<!DOCTYPE html>
<html>
<head>
<title>Precision Cutz Lawn Care</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#061a12;
  color:white;
  text-align:center;
}

.header{
  background:#0c2b1e;
  padding:20px;
}

.header h1{
  color:#2cff88;
  margin:0;
  font-size:34px;
}

.header p{
  color:#9bd6b8;
}

.container{
  max-width:420px;
  margin:20px auto;
  background:#0f2a1d;
  padding:15px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

iframe{
  width:100%;
  height:650px;
  border:none;
  border-radius:15px;
}

.section{
  margin-top:20px;
}

input, select{
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button{
  background:#2cff88;
  color:black;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  font-size:18px;
  margin-top:10px;
}

button:hover{
  background:#24cc6d;
}

.log{
  margin-top:15px;
  font-size:14px;
  color:#9bd6b8;
}

.ai-box{
  background:#081f15;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}

.footer{
  margin:20px;
  font-size:14px;
  color:#88bfa2;
}
</style>
</head>

<body>

<div class="header">
  <h1>PRECISION CUTZ</h1>
  <p>AI Assisted Lawn Care Payments</p>
</div>

<div class="container">

  <!-- PAYMENT WIDGET -->
  <iframe src="https://nowpayments.io/embeds/payment-widget?iid=6386319463"></iframe>

  <!-- AI ASSISTANT -->
  <div class="ai-box">
    <h3>🤖 Precision AI Assistant</h3>
    <p id="aiText">Hi! Need lawn service? Enter your info below.</p>
  </div>

  <!-- CUSTOMER INPUT -->
  <div class="section">
    <input id="name" placeholder="Customer Name">
    <input id="address" placeholder="Service Address">
    
    <select id="service">
      <option>Lawn Cut</option>
      <option>Edge + Trim</option>
      <option>Full Service</option>
    </select>

    <input id="amount" placeholder="Amount Paid ($)">
    
    <button onclick="saveJob()">Confirm Job & Payment</button>

    <div class="log" id="log"></div>
  </div>

</div>

<div class="footer">
  Accepting XRP • BTC • ETH • CRO
</div>

<script>

function saveJob() {

  let name = document.getElementById('name').value;
  let address = document.getElementById('address').value;
  let service = document.getElementById('service').value;
  let amount = document.getElementById('amount').value;

  if(!name || !address || !amount){
    document.getElementById('log').innerHTML = "⚠️ Fill all fields";
    return;
  }

  let jobs = JSON.parse(localStorage.getItem('jobs') || "[]");

  let job = {
    name: name,
    address: address,
    service: service,
    amount: amount,
    status: "PAID",
    time: new Date().toLocaleString()
  };

  jobs.push(job);

  localStorage.setItem('jobs', JSON.stringify(jobs));

  document.getElementById('log').innerHTML =
    "✅ Job Saved: " + name + " | $" + amount;

  document.getElementById('aiText').innerHTML =
    "Payment received. Job scheduled for " + address;

}

</script>

</body>
</html>
