<!DOCTYPE html>
<html>
<head>
<title>Precision Cutz Pay</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#000;
  color:white;
  text-align:center;
}

/* HEADER */
.header{
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

/* AMOUNT DISPLAY */
.amount{
  font-size:60px;
  margin:20px 0;
}

input{
  background:none;
  border:none;
  color:white;
  font-size:60px;
  text-align:center;
  width:100%;
  outline:none;
}

/* BUTTONS */
.actions{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px;
}

.btn{
  padding:15px 30px;
  border-radius:25px;
  font-size:18px;
  border:none;
}

.request{
  background:#333;
  color:white;
}

.pay{
  background:#00d54b;
  color:black;
}

/* CARD */
.card{
  background:#111;
  margin:20px;
  padding:15px;
  border-radius:20px;
}

/* INPUT FIELDS */
.field{
  width:90%;
  padding:12px;
  margin:10px;
  border-radius:12px;
  border:none;
  font-size:16px;
}

/* PAYMENT WIDGET */
iframe{
  width:100%;
  height:500px;
  border:none;
  border-radius:15px;
}

/* STATUS */
.status{
  margin-top:15px;
  color:#00d54b;
}

</style>
</head>

<body>

<div class="header">
  Precision Cutz 💰
</div>

<!-- AMOUNT -->
<div class="amount">
  $<input id="amount" placeholder="0">
</div>

<!-- BUTTONS -->
<div class="actions">
  <button class="btn request">Request</button>
  <button class="btn pay" onclick="showPay()">Pay</button>
</div>

<!-- PAYMENT AREA -->
<div class="card" id="paymentBox" style="display:none;">
  <iframe src="https://nowpayments.io/embeds/payment-widget?iid=6386319463"></iframe>
</div>

<!-- CUSTOMER INFO -->
<div class="card">

  <input class="field" id="name" placeholder="Customer Name">
  <input class="field" id="address" placeholder="Service Address">

  <select class="field" id="service">
    <option>Lawn Cut</option>
    <option>Edge + Trim</option>
    <option>Full Service</option>
  </select>

  <button class="btn pay" onclick="confirmPayment()">Confirm Payment</button>

  <div class="status" id="status"></div>

</div>

<script>

function showPay(){
  document.getElementById("paymentBox").style.display = "block";
}

function confirmPayment(){

  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;
  let amount = document.getElementById("amount").value;

  if(!name || !address || !amount){
    document.getElementById("status").innerHTML = "⚠️ Fill all fields";
    return;
  }

  let jobs = JSON.parse(localStorage.getItem('jobs') || "[]");

  jobs.push({
    name,
    address,
    amount,
    time:new Date().toLocaleString()
  });

  localStorage.setItem('jobs', JSON.stringify(jobs));

  document.getElementById("status").innerHTML =
    "✅ Payment logged for " + name;

}

</script>

</body>
</html>
