<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Payments</title>

<style>

/* BACKGROUND */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #001a0d 0%, #000000 100%);
  color: #00ff66;
  text-align: center;
}

/* LOGO */
.logo {
  width: 90%;
  max-width: 420px;
  margin-top: 20px;
  filter:
    drop-shadow(0 0 10px #00ff66)
    drop-shadow(0 0 30px #00ff66)
    drop-shadow(0 0 60px #00ff66);
}

/* AMOUNT (3D STYLE) */
.amount {
  font-size: 90px;
  margin: 20px 0;
  font-weight: bold;
  color: #00ff66;
  text-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66,
    0 0 60px #00ff66,
    0 6px 0 #003311,
    0 12px 20px rgba(0,0,0,0.8);
}

/* BUTTON ROW */
.button-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 25px;
}

/* BUTTON STYLE */
.btn {
  border: 2px solid #00ff66;
  background: transparent;
  color: #00ff66;
  padding: 15px 40px;
  border-radius: 20px;
  font-size: 18px;
  cursor: pointer;
  box-shadow:
    0 0 10px #00ff66,
    0 0 20px #00ff66;
  transition: 0.2s;
}

.btn:hover {
  background: rgba(0,255,100,0.1);
}

.btn:active {
  transform: scale(0.95);
}

/* KEYPAD GRID */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding: 20px;
}

/* 3D KEYS */
.key {
  font-size: 45px;
  font-weight: bold;
  color: #00ff66;
  cursor: pointer;
  user-select: none;

  text-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66,
    0 6px 0 #003311,
    0 10px 20px rgba(0,0,0,0.8);

  transition: 0.1s;
}

.key:active {
  transform: scale(0.85);
}

/* DELETE BUTTON */
.delete {
  border: 2px solid #00ff66;
  border-radius: 10px;
  padding: 10px;
  box-shadow: 0 0 15px #00ff66;
}

</style>
</head>

<body>

<!-- LOGO -->
<img src="logo.PNG" class="logo">

<!-- AMOUNT -->
<div class="amount" id="amount">$0.00</div>

<!-- BUTTONS -->
<div class="button-row">
  <button class="btn" onclick="requestPayment()">Request</button>
  <button class="btn" onclick="payNow()">Pay</button>
</div>

<!-- KEYPAD -->
<div class="keypad">

  <div class="key" onclick="press('1')">1</div>
  <div class="key" onclick="press('2')">2</div>
  <div class="key" onclick="press('3')">3</div>

  <div class="key" onclick="press('4')">4</div>
  <div class="key" onclick="press('5')">5</div>
  <div class="key" onclick="press('6')">6</div>

  <div class="key" onclick="press('7')">7</div>
  <div class="key" onclick="press('8')">8</div>
  <div class="key" onclick="press('9')">9</div>

  <div class="key" onclick="press('.')">.</div>
  <div class="key" onclick="press('0')">0</div>
  <div class="key delete" onclick="del()">⌫</div>

</div>

<script>

let amount = "";

/* PRESS NUMBER */
function press(val) {
  if (val === "." && amount.includes(".")) return;
  amount += val;
  update();
}

/* DELETE */
function del() {
  amount = amount.slice(0, -1);
  update();
}

/* UPDATE DISPLAY */
function update() {
  let display = amount || "0";

  // format to 2 decimal places
  if (display.includes(".")) {
    let parts = display.split(".");
    if (parts[1].length > 2) {
      parts[1] = parts[1].slice(0, 2);
    }
    display = parts.join(".");
  }

  document.getElementById("amount").innerText = "$" + display;
}

/* BUTTON ACTIONS */
function requestPayment() {
  alert("Requesting $" + (amount || "0.00"));
}

function payNow() {
  alert("Paying $" + (amount || "0.00"));
}

</script>

</body>
</html>
