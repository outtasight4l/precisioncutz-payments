<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Precision Cutz Payments</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ui">

  <!-- BACKGROUND UI -->
  <img src="ui.png" class="ui-bg">

  <!-- LIVE AMOUNT -->
  <div id="amount" class="amount">$0.00</div>

  <!-- REQUEST -->
  <div class="btn request" onclick="requestMoney()"></div>

  <!-- PAY -->
  <div class="btn pay" onclick="payMoney()"></div>

  <!-- KEYPAD -->
  <div class="btn k1" onclick="press('1')"></div>
  <div class="btn k2" onclick="press('2')"></div>
  <div class="btn k3" onclick="press('3')"></div>

  <div class="btn k4" onclick="press('4')"></div>
  <div class="btn k5" onclick="press('5')"></div>
  <div class="btn k6" onclick="press('6')"></div>

  <div class="btn k7" onclick="press('7')"></div>
  <div class="btn k8" onclick="press('8')"></div>
  <div class="btn k9" onclick="press('9')"></div>

  <div class="btn kdot" onclick="press('.')"></div>
  <div class="btn k0" onclick="press('0')"></div>
  <div class="btn kdel" onclick="del()"></div>

</div>

<script src="app.js"></script>

</body>
</html>
