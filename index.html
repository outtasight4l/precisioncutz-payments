<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Pay</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- BACKGROUND UI (AUTO LOAD FIX) -->
  <img id="uiImage" class="ui-bg">

  <!-- AMOUNT DISPLAY -->
  <div class="amount-wrapper">
    <div class="dollar">$</div>
    <div id="amount">0.00</div>
  </div>

  <!-- INVISIBLE BUTTON LAYER -->
  <div class="touch-layer">

    <!-- NUMBERS -->
    <button class="btn b1" onclick="press('1')"></button>
    <button class="btn b2" onclick="press('2')"></button>
    <button class="btn b3" onclick="press('3')"></button>

    <button class="btn b4" onclick="press('4')"></button>
    <button class="btn b5" onclick="press('5')"></button>
    <button class="btn b6" onclick="press('6')"></button>

    <button class="btn b7" onclick="press('7')"></button>
    <button class="btn b8" onclick="press('8')"></button>
    <button class="btn b9" onclick="press('9')"></button>

    <button class="btn bdot" onclick="press('.')"></button>
    <button class="btn b0" onclick="press('0')"></button>
    <button class="btn bdel" onclick="del()"></button>

    <!-- ACTIONS -->
    <button class="action request" onclick="requestPay()"></button>
    <button class="action pay" onclick="payNow()"></button>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
