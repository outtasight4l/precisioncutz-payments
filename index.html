<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Precision Cutz</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- UI IMAGE -->
  <img src="ui.PNG" id="ui">

  <!-- INTERACTION LAYER -->
  <div id="overlay">

    <!-- TOP -->
    <div class="tap qr" onclick="scanQR()"></div>
    <div class="tap ai" onclick="openAI()"></div>

    <!-- MIDDLE -->
    <div class="tap request" onclick="alert('Request clicked')"></div>
    <div class="tap pay" onclick="payNow()"></div>

    <!-- NUMBERS -->
    <div class="tap n1" onclick="press(1)"></div>
    <div class="tap n2" onclick="press(2)"></div>
    <div class="tap n3" onclick="press(3)"></div>

    <div class="tap n4" onclick="press(4)"></div>
    <div class="tap n5" onclick="press(5)"></div>
    <div class="tap n6" onclick="press(6)"></div>

    <div class="tap n7" onclick="press(7)"></div>
    <div class="tap n8" onclick="press(8)"></div>
    <div class="tap n9" onclick="press(9)"></div>

    <div class="tap n0" onclick="press(0)"></div>
    <div class="tap dot" onclick="press('.')"></div>
    <div class="tap clear" onclick="clearInput()"></div>

  </div>

  <!-- DISPLAY -->
  <div id="display"></div>

  <script src="app.js"></script>

</body>
</html>
