<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Payments</title>

<style>

/* ===== BACKGROUND ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #001a0d 0%, #000000 100%);
  color: #00ff66;
  text-align: center;
}

/* ===== TOP ICONS ===== */
.top-bar {
  display: flex;
  justify-content: space-between;
  padding: 20px;
}

.icon-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 2px solid #00ff66;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;

  box-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66;

  transition: 0.2s;
}

.icon-btn:active {
  transform: scale(0.9);
}

/* ===== LOGO ===== */
.logo-container {
  margin-top: -10px;
}

.logo {
  width: 90%;
  max-width: 400px;

  filter:
    drop-shadow(0 0 10px #00ff66)
    drop-shadow(0 0 30px #00ff66)
    drop-shadow(0 0 60px #00ff66);

  transition: 0.2s;
}

.logo-container:active {
  transform: scale(0.97);
}

/* ===== AMOUNT ===== */
.amount {
  font-size: 90px;
  font-weight: bold;
  margin: 20px 0;

  text-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66,
    0 0 60px #00ff66;
}

/* ===== BUTTONS ===== */
.button-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.btn {
  border: 2px solid #00ff66;
  background: transparent;
  color: #00ff66;
  padding: 15px 40px;
  border-radius: 20px;
  font-size: 18px;

  display: flex;
  align-items: center;
  gap: 10px;

  box-shadow:
    0 0 10px #00ff66,
    0 0 20px #00ff66;

  transition: 0.2s;
}

.btn:active {
  transform: scale(0.95);
}

/* ===== KEYPAD ===== */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  padding: 20px;
}

/* ===== 3D NUMBERS ===== */
.key {
  font-size: 50px;
  font-weight: bold;

  text-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66,
    0 6px 0 #003311,
    0 12px 25px rgba(0,0,0,0.9);

  transition: 0.15s;
}

.key:active {
  transform: scale(0.85);
}

/* DELETE */
.delete {
  border: 2px solid #00ff66;
  border-radius: 12px;
  padding: 10px;

  box-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66;
}

</style>
</head>

<body>

<!-- TOP ICONS -->
<div class="top-bar">
  <div class="icon-btn" onclick="openQR()">📷</div>
  <div class="icon-btn" onclick="openAI()">🤖</div>
</div>

<!-- LOGO -->
<div class="logo-container" onclick="resetAmount()">
  <img src="./logo.PNG" class="logo">
</div>

<!-- AMOUNT -->
<div class="amount" id="amount">$0.00</div>

<!-- BUTTONS -->
<div class="button-row">
  <button class="btn" onclick="request()">✈️ Request</button>
  <button class="btn" onclick="pay()">💳 Pay</button>
</div>

<!-- KEYPAD -->
<div class="keypad">

  <div class="key" onclick="press('1')">1</div>
  <div class="key" onclick="press('2')">2</div>
  <div class="key" onclick="press('3')">3</div>

  <div class="key" onclick="press('4')">4</div>
  <div class="key" onclick="press('5')">5</div>
  <div class="key" onclick="press('6')">6</div>

  <div class="key" onclick="press('7')">7</div>
  <div class="key" onclick="press('8')">8</div>
  <div class="key" onclick="press('9')">9</div>

  <div class="key" onclick="press('.')">.</div>
  <div class="key" onclick="press('0')">0</div>
  <div class="key delete" onclick="del()">⌫</div>

</div>

<script>

/* ===== STATE ===== */
let amount = "";

/* ===== INPUT ===== */
function press(val) {
  if (val === "." && amount.includes(".")) return;
  amount += val;
  update();
}

function del() {
  amount = amount.slice(0, -1);
  update();
}

/* ===== FORMAT DISPLAY ===== */
function update() {
  let display = amount || "0";

  if (!display.includes(".")) {
    display += ".00";
  } else {
    let parts = display.split(".");
    parts[1] = (parts[1] + "00").slice(0,2);
    display = parts[0] + "." + parts[1];
  }

  document.getElementById("amount").innerText = "$" + display;
}

/* ===== BUTTON ACTIONS ===== */
function request() {
  alert("Requesting $" + (amount || "0"));
}

function pay() {
  alert("Paying $" + (amount || "0"));
}

function resetAmount() {
  amount = "";
  update();
}

/* ===== TOP ICONS ===== */
function openQR() {
  alert("QR feature coming next");
}

function openAI() {
  alert("AI assistant coming next");
}

</script>

</body>
</html>
