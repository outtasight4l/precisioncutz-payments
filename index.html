<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Precision Cutz</title>

<style>
body {
  margin:0;
  background:black;
}

/* UI */
.ui {
  position:relative;
  width:100%;
  max-width:430px;
  margin:auto;
}

.ui img {
  width:100%;
}

/* PRICE (AUTO FIT) */
#price {
  position:absolute;
  top:34%;
  left:15%;
  width:70%;
  text-align:right;

  font-weight:bold;
  color:#00ff66;

  text-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66,
    0 0 60px #00ff66;

  white-space:nowrap;
}

/* BUTTONS */
.btn {
  position:absolute;
  border-radius:15px;
}

.btn:active {
  transform:scale(0.92);
  box-shadow:0 0 25px #00ff66 inset;
}

/* KEYPAD */
.key { width:26%; height:9%; }

.k1 {top:56%; left:7%;}
.k2 {top:56%; left:37%;}
.k3 {top:56%; left:67%;}

.k4 {top:66%; left:7%;}
.k5 {top:66%; left:37%;}
.k6 {top:66%; left:67%;}

.k7 {top:76%; left:7%;}
.k8 {top:76%; left:37%;}
.k9 {top:76%; left:67%;}

.kC {top:86%; left:7%;}
.k0 {top:86%; left:37%;}
.kB {top:86%; left:67%;}

/* TOP */
.qr {top:4%; left:5%; width:13%; height:9%;}
.ai {top:4%; right:5%; width:13%; height:9%;}
.heart {top:4%; right:25%; width:13%; height:9%;}

/* NEON MODAL */
.modal {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.9);
}

.modal-box {
  width:80%;
  max-width:300px;
  padding:20px;
  border-radius:15px;
  border:2px solid #00ff66;
  box-shadow:0 0 30px #00ff66;
  text-align:center;
  color:#00ff66;
  background:black;
  animation:fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:scale(0.8);}
  to {opacity:1; transform:scale(1);}
}

.modal button {
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#00ff66;
  color:black;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="ui">
  <img src="ui.PNG">

  <!-- PRICE -->
  <div id="price">$0.00</div>

  <!-- KEYPAD -->
  <div class="btn key k1" onclick="press(1)"></div>
  <div class="btn key k2" onclick="press(2)"></div>
  <div class="btn key k3" onclick="press(3)"></div>

  <div class="btn key k4" onclick="press(4)"></div>
  <div class="btn key k5" onclick="press(5)"></div>
  <div class="btn key k6" onclick="press(6)"></div>

  <div class="btn key k7" onclick="press(7)"></div>
  <div class="btn key k8" onclick="press(8)"></div>
  <div class="btn key k9" onclick="press(9)"></div>

  <div class="btn key kC" onclick="clearAll()"></div>
  <div class="btn key k0" onclick="press(0)"></div>
  <div class="btn key kB" onclick="backspace()"></div>

  <!-- TOP -->
  <div class="btn qr" onclick="openQR()"></div>
  <div class="btn ai" onclick="openAI()"></div>
  <div class="btn heart" onclick="heartbeat(this)"></div>
</div>

<!-- AI MODAL -->
<div class="modal" id="aiModal">
  <div class="modal-box">
    🤖 AI SYSTEM  
    <br><br>
    Voice control & automation coming next
    <br>
    <button onclick="closeAI()">Close</button>
  </div>
</div>

<script>
let amount = 0;

function update(){
  let text = "$" + (amount/100).toFixed(2);
  let el = document.getElementById("price");

  el.innerText = text;

  // AUTO FIT
  let size = 70;
  el.style.fontSize = size + "px";

  while (el.scrollWidth > el.parentElement.clientWidth * 0.7 && size > 25) {
    size -= 2;
    el.style.fontSize = size + "px";
  }
}

/* INPUT */
function press(n){
  amount = amount*10 + n;
  update();
}

function clearAll(){
  amount = 0;
  update();
}

function backspace(){
  amount = Math.floor(amount/10);
  update();
}

/* AI MODAL */
function openAI(){
  document.getElementById("aiModal").style.display = "flex";
}

function closeAI(){
  document.getElementById("aiModal").style.display = "none";
}

/* HEART */
function heartbeat(el){
  el.style.boxShadow = "0 0 30px #00ff66";
  setTimeout(()=> el.style.boxShadow = "", 500);
}

/* QR */
function openQR(){
  window.location.href = "https://cash.app/$cryptogang85";
}

update();
</script>

</body>
</html>
