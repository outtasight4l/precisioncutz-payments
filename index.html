<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Pay</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div id="sidebar" class="sidebar">

  <div class="sidebar-header">
    <h2>MENU</h2>
  </div>

  <div class="sidebar-item active" onclick="goHome()">
    🏠 HOME
  </div>

  <div class="sidebar-item" onclick="openPayments()">
    💳 PAYMENTS
  </div>

  <div class="sidebar-item" onclick="openReceipts()">
    🧾 RECEIPTS
  </div>

  <div class="sidebar-item" onclick="openCustomers()">
    👥 CUSTOMERS
  </div>

  <div class="sidebar-item" onclick="openWallet()">
    👛 WALLET
  </div>

  <div class="sidebar-item" onclick="openAnalytics()">
    📊 ANALYTICS
  </div>

  <div class="sidebar-item" onclick="openRoutes()">
    📍 ROUTES
  </div>

  <div class="sidebar-item" onclick="openSettings()">
    ⚙️ SETTINGS
  </div>

  <div class="sidebar-item" onclick="openSupport()">
    🎧 SUPPORT
  </div>

  <div class="sidebar-divider"></div>

  <div class="sidebar-item logout" onclick="logout()">
    🚪 LOG OUT
  </div>

</div>

<!-- ================= OVERLAY ================= -->
<div id="overlay" onclick="closeSidebar()"></div>

<!-- ================= APP ================= -->
<div class="app">

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  </div>

  <!-- YOUR EXISTING UI HERE -->
  <div class="content">
    <h1>Precision Cutz Pay</h1>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button onclick="toggleSidebar()">MENU</button>
    <button onclick="goHome()">HOME</button>
    <button onclick="openSupport()">SUPPORT</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
