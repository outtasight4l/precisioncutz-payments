<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Payments</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- UI IMAGE -->
  <img src="ui.PNG" class="ui">

  <!-- CLICK ZONES -->
  <div class="tap" onclick="press('1')" style="top:55%; left:20%;"></div>
  <div class="tap" onclick="press('2')" style="top:55%; left:50%;"></div>
  <div class="tap" onclick="press('3')" style="top:55%; left:80%;"></div>

  <div class="tap" onclick="press('4')" style="top:65%; left:20%;"></div>
  <div class="tap" onclick="press('5')" style="top:65%; left:50%;"></div>
  <div class="tap" onclick="press('6')" style="top:65%; left:80%;"></div>

  <div class="tap" onclick="press('7')" style="top:75%; left:20%;"></div>
  <div class="tap" onclick="press('8')" style="top:75%; left:50%;"></div>
  <div class="tap" onclick="press('9')" style="top:75%; left:80%;"></div>

  <div class="tap" onclick="press('.')" style="top:85%; left:20%;"></div>
  <div class="tap" onclick="press('0')" style="top:85%; left:50%;"></div>
  <div class="tap" onclick="del()" style="top:85%; left:80%;"></div>

  <!-- REQUEST / PAY -->
  <div class="tap wide" onclick="requestMoney()" style="top:45%; left:30%;"></div>
  <div class="tap wide" onclick="payMoney()" style="top:45%; left:70%;"></div>

</div>

<script src="app.js"></script>

</body>
</html>
