<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Payments</title>

<style>

/* BACKGROUND */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #001a0d 0%, #000000 100%);
  color: #00ff66;
  text-align: center;
  overflow-x: hidden;
}

/* PARTICLE EFFECT */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://www.transparenttextures.com/patterns/stardust.png');
  opacity: 0.2;
  animation: moveBg 20s linear infinite;
}

@keyframes moveBg {
  from { transform: translateY(0); }
  to { transform: translateY(200px); }
}

/* TOP UI */
.top-ui {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
}

/* SIDE ICON BUTTONS */
.circle-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 2px solid #00ff66;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;

  box-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66;

  transition: 0.2s;
}

.circle-btn svg {
  width: 28px;
  fill: #00ff66;
}

.circle-btn:active {
  transform: scale(0.9);
}

/* LOGO */
.logo-btn {
  width: 65%;
  max-width: 320px;

  filter:
    drop-shadow(0 0 20px #00ff66)
    drop-shadow(0 0 50px #00ff66)
    drop-shadow(0 0 100px #00ff66);

  animation: pulse 2.5s infinite alternate;
}

@keyframes pulse {
  from { filter: drop-shadow(0 0 10px #00ff66); }
  to { filter: drop-shadow(0 0 60px #00ff66); }
}

/* AMOUNT */
.amount {
  font-size: 95px;
  font-weight: bold;
  margin: 10px 0;

  text-shadow:
    0 0 20px #00ff66,
    0 0 60px #00ff66,
    0 0 120px #00ff66;

  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #00ff66; }
  to { text-shadow: 0 0 80px #00ff66; }
}

/* NEON LINE */
.neon-line {
  height: 2px;
  width: 80%;
  margin: 10px auto 20px;
  background: #00ff66;

  box-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66;
}

/* BUTTONS */
.button-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 25px;
}

.btn {
  display: flex;
  align-items: center;
  gap: 10px;

  border: 2px solid #00ff66;
  background: transparent;
  color: #00ff66;
  padding: 15px 30px;
  border-radius: 20px;
  font-size: 18px;
  cursor: pointer;

  box-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66;

  transition: 0.2s;
}

.btn svg {
  width: 20px;
  fill: #00ff66;
}

.btn:active {
  transform: scale(0.95);
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 35px;
  padding: 20px;
}

/* 3D KEYS */
.key {
  font-size: 50px;
  font-weight: bold;
  cursor: pointer;
  color: #00ff66;

  text-shadow:
    0 0 20px #00ff66,
    0 0 50px #00ff66,
    0 8px 0 #003311,
    0 15px 30px rgba(0,0,0,0.9);

  transition: 0.15s;
}

.key:active {
  transform: scale(0.8);
}

/* DELETE KEY */
.delete {
  border: 2px solid #00ff66;
  border-radius: 12px;
  padding: 10px;

  box-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66;
}

</style>
</head>

<body>

<!-- TOP -->
<div class="top-ui">

  <div class="circle-btn">
    <!-- QR ICON -->
    <svg viewBox="0 0 24 24">
      <path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM17 17h4v4h-4z"/>
    </svg>
  </div>

  <img src="logo.PNG" class="logo-btn">

  <div class="circle-btn">
    <!-- AI ICON -->
    <svg viewBox="0 0 24 24">
      <path d="M12 2a4 4 0 00-4 4v1H7a3 3 0 00-3 3v5h16v-5a3 3 0 00-3-3h-1V6a4 4 0 00-4-4z"/>
    </svg>
  </div>

</div>

<!-- AMOUNT -->
<div class="amount" id="amount">$0.00</div>

<div class="neon-line"></div>

<!-- BUTTONS -->
<div class="button-row">
  <button class="btn" onclick="request()">
    <!-- PAPER PLANE -->
    <svg viewBox="0 0 24 24">
      <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
    </svg>
    REQUEST
  </button>

  <button class="btn" onclick="pay()">
    <!-- CARD -->
    <svg viewBox="0 0 24 24">
      <path d="M2 5h20v14H2zM2 9h20"/>
    </svg>
    PAY
  </button>
</div>

<!-- KEYPAD -->
<div class="keypad">

  <div class="key" onclick="press('1')">1</div>
  <div class="key" onclick="press('2')">2</div>
  <div class="key" onclick="press('3')">3</div>

  <div class="key" onclick="press('4')">4</div>
  <div class="key" onclick="press('5')">5</div>
  <div class="key" onclick="press('6')">6</div>

  <div class="key" onclick="press('7')">7</div>
  <div class="key" onclick="press('8')">8</div>
  <div class="key" onclick="press('9')">9</div>

  <div class="key" onclick="press('.')">.</div>
  <div class="key" onclick="press('0')">0</div>
  <div class="key delete" onclick="del()">⌫</div>

</div>

<script>

let amount = "";

/* INPUT */
function press(val) {
  if (val === "." && amount.includes(".")) return;
  amount += val;
  update();
}

/* DELETE */
function del() {
  amount = amount.slice(0, -1);
  update();
}

/* FORMAT + UPDATE */
function update() {
  let num = parseFloat(amount);
  document.getElementById("amount").innerText =
    "$" + (isNaN(num) ? "0.00" : num.toFixed(2));
}

/* BUTTON ACTIONS */
function request() {
  alert("Request $" + (amount || "0"));
}

function pay() {
  alert("Pay $" + (amount || "0"));
}

</script>

</body>
</html>
