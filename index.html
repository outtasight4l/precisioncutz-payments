<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Payments</title>

<style>

/* BACKGROUND */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #001a0d 0%, #000000 100%);
  color: #00ff66;
  text-align: center;
}

/* TOP UI CONTAINER */
.top-ui {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
}

/* LOGO BUTTON */
.logo-btn {
  width: 65%;
  max-width: 320px;
  cursor: pointer;
  transition: 0.2s;

  filter:
    drop-shadow(0 0 15px #00ff66)
    drop-shadow(0 0 40px #00ff66)
    drop-shadow(0 0 80px #00ff66);
}

.logo-btn:active {
  transform: scale(0.95);
}

/* SIDE BUTTONS */
.circle-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #00ff66;
  font-size: 22px;
  cursor: pointer;

  border: 2px solid #00ff66;

  box-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66;

  transition: 0.2s;
}

.circle-btn:active {
  transform: scale(0.9);
}

/* AMOUNT */
.amount {
  font-size: 90px;
  margin: 10px 0 20px;
  font-weight: bold;

  text-shadow:
    0 0 15px #00ff66,
    0 0 40px #00ff66,
    0 0 80px #00ff66;
}

/* BUTTON ROW */
.button-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 25px;
}

/* BUTTON STYLE */
.btn {
  border: 2px solid #00ff66;
  background: transparent;
  color: #00ff66;
  padding: 15px 35px;
  border-radius: 20px;
  font-size: 18px;
  cursor: pointer;

  box-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66;

  transition: 0.2s;
}

.btn:active {
  transform: scale(0.95);
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  padding: 20px;
}

/* 3D KEYS */
.key {
  font-size: 45px;
  font-weight: bold;
  cursor: pointer;

  color: #00ff66;

  text-shadow:
    0 0 15px #00ff66,
    0 0 40px #00ff66,
    0 6px 0 #003311,
    0 12px 25px rgba(0,0,0,0.9);

  transition: 0.15s;
}

.key:active {
  transform: scale(0.85);
}

/* DELETE BUTTON */
.delete {
  border: 2px solid #00ff66;
  border-radius: 12px;
  padding: 10px;

  box-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66;
}

</style>
</head>

<body>

<!-- TOP UI -->
<div class="top-ui">

  <div class="circle-btn" onclick="alert('QR')">⌁</div>

  <img src="logo.PNG" class="logo-btn" onclick="alert('Home')">

  <div class="circle-btn" onclick="alert('AI')">🤖</div>

</div>

<!-- AMOUNT -->
<div class="amount" id="amount">$0</div>

<!-- BUTTONS -->
<div class="button-row">
  <button class="btn" onclick="request()">Request</button>
  <button class="btn" onclick="pay()">Pay</button>
</div>

<!-- KEYPAD -->
<div class="keypad">

  <div class="key" onclick="press('1')">1</div>
  <div class="key" onclick="press('2')">2</div>
  <div class="key" onclick="press('3')">3</div>

  <div class="key" onclick="press('4')">4</div>
  <div class="key" onclick="press('5')">5</div>
  <div class="key" onclick="press('6')">6</div>

  <div class="key" onclick="press('7')">7</div>
  <div class="key" onclick="press('8')">8</div>
  <div class="key" onclick="press('9')">9</div>

  <div class="key" onclick="press('.')">.</div>
  <div class="key" onclick="press('0')">0</div>
  <div class="key delete" onclick="del()">⌫</div>

</div>

<script>

let amount = "";

/* PRESS NUMBER */
function press(val) {
  if (val === "." && amount.includes(".")) return;
  amount += val;
  update();
}

/* DELETE */
function del() {
  amount = amount.slice(0, -1);
  update();
}

/* UPDATE DISPLAY */
function update() {
  document.getElementById("amount").innerText =
    "$" + (amount || "0");
}

/* ACTION BUTTONS */
function request() {
  alert("Requesting $" + (amount || "0"));
}

function pay() {
  alert("Paying $" + (amount || "0"));
}

</script>

</body>
</html>
