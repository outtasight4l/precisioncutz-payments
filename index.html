<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Precision Cutz</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  background: black;
}

/* APP CONTAINER */
.app {
  position: relative;
  max-width: 420px;
  margin: auto;
}

/* UI IMAGE */
.ui {
  width: 100%;
  display: block;
}

/* PRICE DISPLAY */
#amount {
  position: absolute;
  top: 33%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #00ff88;
  font-weight: bold;
  text-shadow: 0 0 20px #00ff88;
  white-space: nowrap;
}

/* INVISIBLE BUTTONS */
.hit {
  position: absolute;
  background: transparent;
}

/* REQUEST */
#request {
  top: 45%;
  left: 15%;
  width: 30%;
  height: 8%;
}

/* PAY */
#pay {
  top: 45%;
  right: 15%;
  width: 30%;
  height: 8%;
}

/* QR BUTTON */
#qr {
  top: 12%;
  left: 8%;
  width: 12%;
  height: 8%;
}

/* AI BUTTON */
#ai {
  top: 12%;
  right: 8%;
  width: 12%;
  height: 8%;
}

/* KEYS */
.key { width: 22%; height: 9%; }

.k1 { top: 55%; left: 10%; }
.k2 { top: 55%; left: 39%; }
.k3 { top: 55%; left: 68%; }

.k4 { top: 66%; left: 10%; }
.k5 { top: 66%; left: 39%; }
.k6 { top: 66%; left: 68%; }

.k7 { top: 77%; left: 10%; }
.k8 { top: 77%; left: 39%; }
.k9 { top: 77%; left: 68%; }

.kdot { top: 88%; left: 10%; }
.k0   { top: 88%; left: 39%; }
.kdel { top: 88%; left: 68%; }

/* MODAL */
.modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: black;
  border: 2px solid #00ff88;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 0 25px #00ff88;
  display: none;
  color: #00ff88;
  text-align: center;
}
</style>
</head>

<body>

<div class="app">

  <img src="ui.PNG" class="ui">

  <div id="amount">$0.00</div>

  <!-- BUTTONS -->

  <div id="pay" class="hit" onclick="payNow()"></div>
