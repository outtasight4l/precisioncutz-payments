<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz</title>

<style>
body {
  margin:0;
  background:black;
}

/* UI IMAGE */
.ui {
  position:relative;
  width:100%;
  max-width:430px;
  margin:auto;
}

.ui img {
  width:100%;
  display:block;
}

/* PRICE DISPLAY */
#price {
  position:absolute;
  top:34%;
  left:15%;
  width:70%;
  text-align:right;

  font-size:60px;
  font-weight:bold;
  color:#00ff66;

  text-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66,
    0 0 60px #00ff66;
}

/* INVISIBLE BUTTONS */
.btn {
  position:absolute;
  border-radius:15px;
}

/* TAP EFFECT */
.btn:active {
  transform:scale(0.9);
  box-shadow:0 0 20px #00ff66 inset;
}

/* KEYPAD (PIXEL LOCKED) */
.key { width:26%; height:9%; }

.k1 {top:56%; left:7%;}
.k2 {top:56%; left:37%;}
.k3 {top:56%; left:67%;}

.k4 {top:66%; left:7%;}
.k5 {top:66%; left:37%;}
.k6 {top:66%; left:67%;}

.k7 {top:76%; left:7%;}
.k8 {top:76%; left:37%;}
.k9 {top:76%; left:67%;}

.kC {top:86%; left:7%;}
.k0 {top:86%; left:37%;}
.kB {top:86%; left:67%;}

/* TOP ICONS */
.qr {top:4%; left:5%; width:13%; height:9%;}
.ai {top:4%; right:5%; width:13%; height:9%;}
.heart {top:4%; right:25%; width:13%; height:9%;}

/* QR MODAL */
#qrModal {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
}

#qrModal img {
  width:85%;
  max-width:350px;
  border-radius:20px;
  box-shadow:0 0 30px #00ff66;
}

/* HEART ANIMATION */
.pulse {
  animation:pulse 1s infinite;
}

@keyframes pulse {
  0% { box-shadow:0 0 5px #00ff66; }
  50% { box-shadow:0 0 25px #00ff66; }
  100% { box-shadow:0 0 5px #00ff66; }
}
</style>
</head>

<body>

<div class="ui">
  <!-- YOUR REAL UI -->
  <img src="ui.PNG">

  <!-- PRICE -->
  <div id="price">$0.00</div>

  <!-- KEYPAD -->
  <div class="btn key k1" onclick="press(1)"></div>
  <div class="btn key k2" onclick="press(2)"></div>
  <div class="btn key k3" onclick="press(3)"></div>

  <div class="btn key k4" onclick="press(4)"></div>
  <div class="btn key k5" onclick="press(5)"></div>
  <div class="btn key k6" onclick="press(6)"></div>

  <div class="btn key k7" onclick="press(7)"></div>
  <div class="btn key k8" onclick="press(8)"></div>
  <div class="btn key k9" onclick="press(9)"></div>

  <div class="btn key kC" onclick="clearAll()"></div>
  <div class="btn key k0" onclick="press(0)"></div>
  <div class="btn key kB" onclick="backspace()"></div>

  <!-- TOP -->
  <div class="btn qr" onclick="openQR()"></div>
  <div class="btn ai" onclick="aiMode()"></div>
  <div class="btn heart" onclick="heartbeat(this)"></div>
</div>

<!-- QR POPUP -->
<div id="qrModal" onclick="closeQR()">
  <img src="ui.PNG" onclick="payFromQR(event)">
</div>

<script>
let amount = 0;

function update(){
  document.getElementById("price").innerText =
    "$" + (amount/100).toFixed(2);
}

/* INPUT */
function press(n){
  amount = amount*10 + n;
  update();
}

function clearAll(){
  amount = 0;
  update();
}

function backspace(){
  amount = Math.floor(amount/10);
  update();
}

/* QR */
function openQR(){
  document.getElementById("qrModal").style.display = "flex";
}

function closeQR(){
  document.getElementById("qrModal").style.display = "none";
}

function payFromQR(e){
  e.stopPropagation();
  let v = (amount/100).toFixed(2);
  window.location.href = `https://cash.app/$cryptogang85/${v}`;
}

/* HEART */
function heartbeat(el){
  el.classList.toggle("pulse");
}

/* AI */
function aiMode(){
  alert("AI system coming next");
}

update();
</script>

</body>
</html>
