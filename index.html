<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Payments</title>

<style>

/* BACKGROUND */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #001a0d 0%, #000000 100%);
  color: #00ff66;
  text-align: center;
}

/* LOGO */
.logo {
  width: 90%;
  max-width: 400px;
  margin-top: 20px;
  filter:
    drop-shadow(0 0 10px #00ff66)
    drop-shadow(0 0 30px #00ff66)
    drop-shadow(0 0 60px #00ff66);
}

/* AMOUNT */
.amount {
  font-size: 90px;
  margin: 20px 0;
  font-weight: bold;
  text-shadow:
    0 0 10px #00ff66,
    0 0 30px #00ff66,
    0 0 60px #00ff66;
}

/* BUTTONS */
.button-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.btn {
  border: 2px solid #00ff66;
  background: transparent;
  color: #00ff66;
  padding: 15px 40px;
  border-radius: 20px;
  font-size: 20px;
  box-shadow:
    0 0 10px #00ff66,
    0 0 20px #00ff66;
}

/* KEYPAD GRID */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding: 20px;
}

/* 3D NUMBER STYLE */
.key {
  font-size: 45px;
  font-weight: bold;
  color: #00ff66;
  text-shadow:
    0 0 10px #00ff66,
    0 0 25px #00ff66,
    0 6px 0 #003311,
    0 10px 20px rgba(0,0,0,0.8);
}

/* PRESS EFFECT */
.key:active {
  transform: scale(0.9);
}

/* DELETE BUTTON STYLE */
.delete {
  border: 2px solid #00ff66;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 0 15px #00ff66;
}

</style>
</head>

<body>

<!-- LOGO -->
<img src="logo.PNG" class="logo">

<!-- AMOUNT -->
<div class="amount" id="amount">$0</div>

<!-- BUTTONS -->
<div class="button-row">
  <button class="btn">Request</button>
  <button class="btn">Pay</button>
</div>

<!-- KEYPAD -->
<div class="keypad">

  <div class="key" onclick="press('1')">1</div>
  <div class="key" onclick="press('2')">2</div>
  <div class="key" onclick="press('3')">3</div>

  <div class="key" onclick="press('4')">4</div>
  <div class="key" onclick="press('5')">5</div>
  <div class="key" onclick="press('6')">6</div>

  <div class="key" onclick="press('7')">7</div>
  <div class="key" onclick="press('8')">8</div>
  <div class="key" onclick="press('9')">9</div>

  <div class="key" onclick="press('.')">.</div>
  <div class="key" onclick="press('0')">0</div>
  <div class="key delete" onclick="del()">⌫</div>

</div>

<script>

let amount = "";

function press(val) {
  if (val === "." && amount.includes(".")) return;
  amount += val;
  update();
}

function del() {
  amount = amount.slice(0, -1);
  update();
}

function update() {
  document.getElementById("amount").innerText = "$" + (amount || "0");
}

</script>

</body>
</html>
