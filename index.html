<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Payments</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <img src="ui.PNG" class="ui">

  <!-- 🔥 PERFECT MATCH DISPLAY -->
  <div id="display">$0.00</div>

  <!-- BUTTON OVERLAY -->
  <div class="tap wide" style="top:48%; left:30%;" onclick="requestMoney()"></div>
  <div class="tap wide" style="top:48%; left:70%;" onclick="payMoney()"></div>

  <div class="tap" style="top:63%; left:20%;" onclick="press('1')"></div>
  <div class="tap" style="top:63%; left:50%;" onclick="press('2')"></div>
  <div class="tap" style="top:63%; left:80%;" onclick="press('3')"></div>

  <div class="tap" style="top:71%; left:20%;" onclick="press('4')"></div>
  <div class="tap" style="top:71%; left:50%;" onclick="press('5')"></div>
  <div class="tap" style="top:71%; left:80%;" onclick="press('6')"></div>

  <div class="tap" style="top:79%; left:20%;" onclick="press('7')"></div>
  <div class="tap" style="top:79%; left:50%;" onclick="press('8')"></div>
  <div class="tap" style="top:79%; left:80%;" onclick="press('9')"></div>

  <div class="tap" style="top:87%; left:20%;" onclick="press('.')"></div>
  <div class="tap" style="top:87%; left:50%;" onclick="press('0')"></div>
  <div class="tap" style="top:87%; left:80%;" onclick="del()"></div>

</div>

<script src="app.js"></script>

</body>
</html>
