<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz</title>

<link rel="stylesheet" href="style.css">

<script src="https://js.stripe.com/v3/"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<div class="app">

<img src="ui.PNG" class="ui">

<div class="btn qr" onclick="openQR()"></div>
<div class="btn ai" onclick="openAI()"></div>

<div class="btn request" onclick="requestMoney()"></div>
<div class="btn pay" onclick="payMoney()"></div>

<div id="amount" class="amount">$0.00</div>

<div class="keypad">
<button onclick="press(1)">1</button>
<button onclick="press(2)">2</button>
<button onclick="press(3)">3</button>

<button onclick="press(4)">4</button>
<button onclick="press(5)">5</button>
<button onclick="press(6)">6</button>

<button onclick="press(7)">7</button>
<button onclick="press(8)">8</button>
<button onclick="press(9)">9</button>

<button onclick="dot()">.</button>
<button onclick="press(0)">0</button>
<button onclick="clearLast()">⌫</button>
</div>

</div>

<!-- AI -->
<div id="chatModal" class="modal">
<div class="box">
<div class="header">AI Assistant <button onclick="closeAI()">X</button></div>
<div id="chatMessages" class="messages"></div>
<div class="input">
<input id="userInput">
<button onclick="sendMessage()">Send</button>
</div>
</div>
</div>

<!-- QR -->
<div id="qrModal" class="modal">
<div class="box">
<div class="header">Scan QR <button onclick="closeQR()">X</button></div>
<div id="qr-reader" style="width:100%"></div>
</div>
</div>

<script src="app.js"></script>

</body>
</html>
