<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Pay</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- BACKGROUND UI -->
  <img src="ui.png" class="ui-bg">

  <!-- AMOUNT DISPLAY -->
  <div class="amount-wrapper">
    <span class="dollar">$</span>
    <div id="amount">0.00</div>
  </div>

  <!-- INVISIBLE TOUCH LAYER -->
  <div class="touch-layer">

    <!-- NUMBER GRID -->
    <button onclick="press('1')" class="b b1"></button>
    <button onclick="press('2')" class="b b2"></button>
    <button onclick="press('3')" class="b b3"></button>

    <button onclick="press('4')" class="b b4"></button>
    <button onclick="press('5')" class="b b5"></button>
    <button onclick="press('6')" class="b b6"></button>

    <button onclick="press('7')" class="b b7"></button>
    <button onclick="press('8')" class="b b8"></button>
    <button onclick="press('9')" class="b b9"></button>

    <button onclick="press('.')" class="b bdot"></button>
    <button onclick="press('0')" class="b b0"></button>
    <button onclick="del()" class="b bdel"></button>

    <!-- ACTION BUTTONS -->
    <button onclick="requestPay()" class="action request"></button>
    <button onclick="payNow()" class="action pay"></button>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
