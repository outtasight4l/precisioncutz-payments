<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Payments</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- UI IMAGE -->
  <img src="ui.PNG" class="ui">

  <!-- 🔥 LIVE DISPLAY OVERLAY -->
  <div id="display">$0.00</div>

  <!-- ===== CLICK ZONES ===== -->

  <!-- TOP ICONS -->
  <div class="tap small" style="top:6%; left:10%;" onclick="openQR()"></div>
  <div class="tap small" style="top:6%; right:10%;" onclick="openAI()"></div>

  <!-- LOGO BUTTON -->
  <div class="tap logo" style="top:15%; left:50%;" onclick="resetAmount()"></div>

  <!-- REQUEST / PAY -->
  <div class="tap wide" style="top:45%; left:30%;" onclick="requestMoney()"></div>
  <div class="tap wide" style="top:45%; left:70%;" onclick="payMoney()"></div>

  <!-- KEYPAD -->
  <div class="tap" style="top:60%; left:20%;" onclick="press('1')"></div>
  <div class="tap" style="top:60%; left:50%;" onclick="press('2')"></div>
  <div class="tap" style="top:60%; left:80%;" onclick="press('3')"></div>

  <div class="tap" style="top:68%; left:20%;" onclick="press('4')"></div>
  <div class="tap" style="top:68%; left:50%;" onclick="press('5')"></div>
  <div class="tap" style="top:68%; left:80%;" onclick="press('6')"></div>

  <div class="tap" style="top:76%; left:20%;" onclick="press('7')"></div>
  <div class="tap" style="top:76%; left:50%;" onclick="press('8')"></div>
  <div class="tap" style="top:76%; left:80%;" onclick="press('9')"></div>

  <div class="tap" style="top:84%; left:20%;" onclick="press('.')"></div>
  <div class="tap" style="top:84%; left:50%;" onclick="press('0')"></div>
  <div class="tap" style="top:84%; left:80%;" onclick="del()"></div>

</div>

<script src="app.js"></script>

</body>
</html>
