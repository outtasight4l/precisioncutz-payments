<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precision Cutz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <img src="logo.png" class="logo">
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

  <!-- MENU BUTTON -->
  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <!-- BACKGROUND UI IMAGE -->
  <img src="ui.png" class="ui-bg">

  <!-- AMOUNT DISPLAY -->
  <div id="amount">$0.00</div>

  <!-- BUTTONS -->
  <button class="btn request" onclick="requestMoney()">REQUEST</button>
  <button class="btn pay" onclick="payNow()">PAY</button>

  <!-- KEYPAD -->
  <div class="keypad">
    <button onclick="press(1)">1</button>
    <button onclick="press(2)">2</button>
    <button onclick="press(3)">3</button>
    <button onclick="press(4)">4</button>
    <button onclick="press(5)">5</button>
    <button onclick="press(6)">6</button>
    <button onclick="press(7)">7</button>
    <button onclick="press(8)">8</button>
    <button onclick="press(9)">9</button>
    <button onclick="press('.')">.</button>
    <button onclick="press(0)">0</button>
    <button onclick="clearAmount()">⌫</button>
  </div>

</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <div class="profile">
    <img src="profile.png">
    <h2>CryptoGang85</h2>
  </div>

  <ul>
    <li>Home</li>
    <li>Payments</li>
    <li>Receipts</li>
    <li>Customers</li>
    <li>Wallet</li>
    <li>Analytics</li>
    <li>Routes</li>
    <li>Settings</li>
    <li>Support</li>
    <li class="logout">Logout</li>
  </ul>
</div>

<script src="script.js"></script>
</body>
</html>
