<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Cutz Pay</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial, sans-serif;
}

.container {
  position: relative;
  max-width: 420px;
  margin: auto;
}

/* UI IMAGE */
.ui {
  width: 100%;
  display: block;
}

/* CLICK AREAS */
.tap {
  position: absolute;
}

/* QR */
.qr {
  top: 5%;
  left: 5%;
  width: 20%;
  height: 12%;
}

/* AI */
.ai {
  top: 5%;
  right: 5%;
  width: 20%;
  height: 12%;
}

/* REQUEST */
.request {
  top: 48%;
  left: 8%;
  width: 36%;
  height: 8%;
}

/* PAY */
.pay {
  top: 48%;
  right: 8%;
  width: 36%;
  height: 8%;
}

/* AMOUNT DISPLAY */
.amount {
  position: absolute;
  top: 36%;
  left: 18%;
  width: 64%;
  height: 8%;
  color: #00ff99;
  font-size: 28px;
  display: flex;
  align-items: center;
  padding-left: 12px;
  overflow: hidden;
}

/* NUMBER GRID (invisible tap zones) */
.keypad {
  position: absolute;
  bottom: 5%;
  width: 100%;
  height: 35%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

/* each key */
.key {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div class="container">

  <!-- UI IMAGE -->
  <img src="ui.PNG" class="ui">

  <!-- TAP AREAS -->
  <div class="tap qr" onclick="openQR()"></div>
  <div class="tap ai" onclick="openAI()"></div>
  <div class="tap request" onclick="requestMoney()"></div>
  <div class="tap pay" onclick="payNow()"></div>

  <!-- AMOUNT -->
  <div class="amount" id="amount">$0.00</div>

  <!-- KEYPAD -->
  <div class="keypad">
    <div class="key" onclick="press(1)"></div>
    <div class="key" onclick="press(2)"></div>
    <div class="key" onclick="press(3)"></div>
    <div class="key" onclick="press(4)"></div>
    <div class="key" onclick="press(5)"></div>
    <div class="key" onclick="press(6)"></div>
    <div class="key" onclick="press(7)"></div>
    <div class="key" onclick="press(8)"></div>
    <div class="key" onclick="press(9)"></div>
    <div class="key" onclick="press('.')"></div>
    <div class="key" onclick="press(0)"></div>
    <div class="key" onclick="clearAmount()"></div>
  </div>

</div>

<script>
let value = "";

/* ======================
   NUMBER INPUT
====================== */
function press(num) {
  if (num === '.' && value.includes('.')) return;
  value += num;
  updateDisplay();
}

function clearAmount() {
  value = "";
  updateDisplay();
}

function updateDisplay() {
  let formatted = parseFloat(value || 0).toFixed(2);
  document.getElementById("amount").innerText = "$ " + formatted;
}

/* ======================
   AI ASSISTANT (WORKING)
====================== */
async function openAI() {
  const message = prompt("Ask AI Assistant:");

  if (!message) return;

  try {
    const res = await fetch("https://precisioncutz-api.onrender.com/ai", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: message })
    });

    const data = await res.json();

    alert(data.reply || "No response from AI");

  } catch (err) {
    alert("AI error: " + err.message);
  }
}

/* ======================
   QR (placeholder)
====================== */
function openQR() {
  alert("QR Scanner coming next");
}

/* ======================
   REQUEST
====================== */
function requestMoney() {
  if (!value) {
    alert("Enter amount first");
    return;
  }
  alert("Request sent: $" + value);
}

/* ======================
   STRIPE PAYMENT
====================== */
async function payNow() {
  const amount = parseFloat(value);

  if (!amount || amount <= 0) {
    alert("Enter amount first");
    return;
  }

  try {
    const res = await fetch("https://precisioncutz-api.onrender.com/create-payment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ amount })
    });

    const data = await res.json();

    if (data.id) {
      window.location.href = "https://checkout.stripe.com/pay/" + data.id;
    } else {
      alert("Payment error");
    }

  } catch (err) {
    alert("Payment failed: " + err.message);
  }
}
</script>

</body>
</html>
